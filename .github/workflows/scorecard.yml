---
# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard supply-chain security
on:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: "33 7 * * 0"
  push:
    branches: ["main"]

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Keep scheduled and push analysis on the default branch.
    if: >-
      github.event.repository.default_branch == github.ref_name ||
      github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results to the OpenSSF API and enable the badge.
      id-token: write

    steps:
      - name: "Checkout code"
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Run analysis"
        # v2.5.0
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          # Uses the default GITHUB_TOKEN; no personal access token is required.
          publish_results: true

          # Uncomment file_mode if .gitattributes marks files export-ignore.
          # file_mode: git

      # Optional: upload SARIF results to the repository Actions tab.
      # Comment out this step to disable artifact uploads.
      - name: "Upload artifact"
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard (optional).
      # Comment out this step to disable code-scanning uploads.
      - name: "Upload to code-scanning"
        # v4.38.3
        uses: >-
          github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
